name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:

  # CODE QUALITY

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run lint
        working-directory: app
        run: npm run lint --if-present

      - name: Run tests
        working-directory: app
        run: npm test


 
  # SAST - CODEQL
 
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3


 
  #DEPENDENCY SCANNING
 
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./app
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true


 
  #SECRET SCANNING
 
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


 
  #DOCKER BUILD
 
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - quality
      - sast
      - dependency-scan
      - secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            -t gitops-app:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: docker images gitops-app



  #TRIVY CONTAINER SCAN
 
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: app
        run: |
          docker build -t gitops-app:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
            scan-type: image
            scan-ref: gitops-app:${{ github.sha }}
            format: table
            severity: CRITICAL,HIGH
            ignore-unfixed: true
            exit-code: 0
 
  #SBOM

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            -t gitops-app:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gitops-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json